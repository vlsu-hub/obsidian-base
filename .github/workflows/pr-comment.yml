name: Post PR Validation Comment

on:
  workflow_run:
    workflows: ["Check Contributing Rules"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание отчёта валидации
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-validation-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация или обновление комментария в PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('report/pr_number.txt') || !fs.existsSync('report/pr_report.md')) {
              core.info('Артефакты отчёта не найдены, комментарий пропущен.');
              return;
            }

            const prNumber = Number(fs.readFileSync('report/pr_number.txt', 'utf8').trim());
            let body = fs.readFileSync('report/pr_report.md', 'utf8').trim();
            const marker = '<!-- vlsu-contributing-bot -->';

            if (!prNumber || !body) {
              core.info('Пустой номер PR или тело отчёта.');
              return;
            }

            if (body.length > 65000) {
              body = body.slice(0, 65000) + '\n\n... *(отчёт обрезан из-за лимита длины комментария GitHub)*';
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
